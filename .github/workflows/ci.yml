name: ci

# Every push and pull request is compiled and tested. Pushes to master also
# publish the image to GHCR. Production changes only through a manual run of
# this workflow with deploy ticked.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this commit to the droplet"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jared-powell-wku/discord-bot

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/node
    env:
      CHROMEDRIVER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/node/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: project/node
          file: project/node/Dockerfile_prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must not contain an env file
        run: |
          docker run --rm --entrypoint sh "$IMAGE:${{ steps.tag.outputs.value }}" -c \
            'found=$(find /app -maxdepth 2 -name ".env*" ! -path "*/node_modules/*"); [ -z "$found" ] || { echo "env file in image: $found"; exit 1; }'

  deploy:
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-discord-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Bundle stack files
        run: bash deploy/make-bundle.sh bundle
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C bundle . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "deploy discord-bot sha-${GITHUB_SHA::12} --bundle"
