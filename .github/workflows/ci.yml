name: ci

# Every push and pull request is compiled and tested. A push to master also
# publishes the image to GHCR and then deploys it to the droplet (see the deploy
# job for how to pause that). The droplet-side rules are in deploy/README.md of
# the cantus.dev repo; this stack is `discord-bot` there.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this commit to the droplet (master only)"
        type: choice
        default: discord-bot
        options: [discord-bot, none]

permissions:
  contents: read

env:
  # Named after this repository, which therefore owns the package. The older
  # discord-bot package belongs to the archived Discord-Bot repository, and a
  # workflow token from here is refused by it.
  IMAGE: ghcr.io/jared-powell-wku/geoffrey

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/node
    env:
      CHROMEDRIVER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/node/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: project/node
          file: project/node/Dockerfile_prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must not contain an env file
        run: |
          docker run --rm --entrypoint sh "$IMAGE:${{ steps.tag.outputs.value }}" -c \
            'found=$(find /app -maxdepth 2 -name ".env*" ! -path "*/node_modules/*"); [ -z "$found" ] || { echo "env file in image: $found"; exit 1; }'

  # Every build of master ends in production. The image that was just published
  # is streamed to the droplet, because the GHCR package is private and the
  # droplet holds no registry credential. The droplet's deploy script then runs
  # deploy/pre-deploy (a verified database dump, then the pending migrations),
  # replaces the bot, health-checks it and brings the previous tag back if that
  # fails. The MariaDB image is not built here: it is pinned by MARIADB_IMAGE on
  # the droplet, so only the bot's image is sent.
  #
  # To pause this, set the repository variable AUTO_DEPLOY to off. To rebuild
  # master without deploying, run the workflow by hand with deploy set to none.
  deploy:
    needs: image
    if: ${{ !failure() && !cancelled() && needs.image.result == 'success' && github.ref == 'refs/heads/master' && inputs.deploy != 'none' && vars.AUTO_DEPLOY != 'off' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-discord-bot
      cancel-in-progress: false
    defaults:
      run:
        # Named explicitly so that steps run with pipefail: a failed `docker save`
        # or `tar` must fail the step, not be hidden by the ssh after the pipe.
        shell: bash
    env:
      STACK: discord-bot
    steps:
      - name: Are the deploy secrets configured?
        env:
          CONFIGURED: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_KNOWN_HOSTS != '' && secrets.DEPLOY_HOST != '' }}
        run: |
          if [ "$CONFIGURED" != "true" ]; then
            echo "::error::This commit is on master and its image is published, but it is NOT in production: the repository secrets DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and DEPLOY_HOST are not all set. See \"Letting CI deploy\" in deploy/README.md of the cantus.dev repo."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is pinned on the droplet to `deploy --gate`, so the words
          # after `ssh droplet` are a request to that script, not a shell command.
          printf 'Host droplet\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" > ~/.ssh/config
          echo "TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Send the image to the droplet
        run: |
          docker pull --quiet --platform linux/amd64 "$IMAGE:$TAG"
          docker save "$IMAGE:$TAG" | gzip | ssh droplet load
      - name: Deploy
        run: |
          # compose.yaml, pre-deploy, migrations/ and initdb/: the only paths the
          # droplet's deploy script accepts. Env files never travel with a deploy.
          bash deploy/make-bundle.sh bundle
          tar -czf - -C bundle . | ssh droplet "deploy $STACK $TAG --bundle"
